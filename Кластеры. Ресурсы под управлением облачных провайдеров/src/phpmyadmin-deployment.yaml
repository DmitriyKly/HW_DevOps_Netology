apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        env:
        - name: PMA_HOST
          value: "rc1a-64190l4gs37lalg0.mdb.yandexcloud.net"
        - name: PMA_USER
          value: "netology_user"
        - name: PMA_PASSWORD
          value: "Qwe1234567890"
        ports:
        - containerPort: 80