apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
      - name: init-service
        image: busybox
        command: 
        - sh
        - -c
        - |
          until nslookup nginx-service.default.svc.cluster.local && \
                nc -z nginx-service 80; do
            echo "waiting for service";
            sleep 2;
          done
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80