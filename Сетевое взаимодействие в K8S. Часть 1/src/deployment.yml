apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-multitool-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-multitool-app
  template:
    metadata:
      labels:
        app: nginx-multitool-app
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
      - name: multitool-container
        image: wbitt/network-multitool:latest
        command: ["sleep", "infinity"]
        ports:
        - containerPort: 8080