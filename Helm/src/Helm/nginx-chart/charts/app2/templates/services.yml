apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-nginx-chart-service
spec:
  type: {{.Values.service.type}}
  selector:
    app: {{.Release.Name}}-nginx-chart-deploy
  ports:
    - protocol: TCP
      port: {{.Values.service.port}}
      targetPort: {{.Values.service.targetPort}}
      nodePort: {{.Values.service.nodePort}}