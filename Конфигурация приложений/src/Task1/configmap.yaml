apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>My Kubernetes Page</title>
    </head>
    <body>
        <h1>Hello from Kubernetes!</h1>
        <p>This page is served from a ConfigMap</p>
    </body>
    </html>
  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    }