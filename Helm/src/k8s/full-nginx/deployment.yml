apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-chart-deploy01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-chart-deploy01
  template:
    metadata:
      labels:
        app: nginx-chart-deploy01
    spec:
      containers:
      - name: nginx-chart-container
        image: nginx:latest
        ports:
          - containerPort: 80
        volumeMounts:
          - name: nginx-storage
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: nginx-html
            mountPath: /usr/share/nginx/html
          - name: nginx-logs
            mountPath: /var/log/nginx
      volumes:
        - name: nginx-storage
          configMap:
            name: nginx-config01
            items:
            - key: nginx.conf
              path: nginx.conf
        - name: nginx-html
          persistentVolumeClaim:
            claimName: pvc-nginx-html
        - name: nginx-logs
          persistentVolumeClaim:
            claimName: pvc-nginx-logs

